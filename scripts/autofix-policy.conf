# ═══ 自动处置授权边界 ═══
# 依据: memory/2026-04-15.md v34「autofix-loop」
# 原则: 检测 ≠ 处置。告警的唯一消费者不是 7x24 的人,必须有闭环。
#       处置权限写进配置,而不是每次临场决定(每次现问 = 永远不做)。
#
# 格式: <动作>=<权限>   权限 ∈ auto | manual | forbidden
#   auto     → 满足前置条件时可自动执行(必须可复核、可回滚)
#   manual   → 只告警,等人处理
#   forbidden → 禁止自动执行

# 回收站中【超过保留窗口】的旧备份:删除是确定规则、可复核、产物就是空间
#   前置:仅限 $NAS_RECYCL_DIR/openclaw-*.tgz,且 mtime 早于 RETAIN_DAYS
#   复核:删除后必须 df 校验空间确实释放
recycle_purge=auto
RETAIN_DAYS=30
NAS_RECYCL_DIR=/mnt/h/#recycle/AI/openclaw.zone/WSL
NAS_BACKUP_DIR=/mnt/h/AI/openclaw.zone/WSL
# 空间下限:低于此值才触发清理(避免日常无谓删除)
SPACE_TRIGGER_GB=64
# 安全阀:单次清理最多删除多少份(防止规则写错导致大规模删除)
MAX_PURGE_FILES=10
# 空间下限仍不足时是否允许继续清(默认否 → 升级为人工介入)
ALLOW_ESCALATION_PURGE=0

# 影响在线服务,必须人工授权
restart_gateway=manual
upgrade_openclaw=manual
# 涉及凭据,必须人工授权
modify_provider_credentials=manual
# 结构性变更(改脚本逻辑/配置结构)必须人工授权
modify_scripts=manual
